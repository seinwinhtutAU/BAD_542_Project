# Include inside the existing server { } block. Must not shadow /content or /api.
# Uses 127.0.0.1 + the host ports published in docker/docker-compose.yml, since
# this Nginx runs bare-metal on the VPS, not as a container on the same Docker
# network as backend/frontend — the "backend"/"frontend" service names would
# not resolve here.
location /project/api/ {
  proxy_pass http://127.0.0.1:4000/api/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /project/ {
  proxy_pass http://127.0.0.1:8081/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
