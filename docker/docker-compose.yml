services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_health
      MYSQL_USER: campus_health
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # Overrides backend/.env's DATABASE_URL (which targets localhost for host-run dev)
      # with the in-network mysql service hostname, since this container isn't localhost.
      DATABASE_URL: mysql://campus_health:${MYSQL_PASSWORD}@mysql:3306/campus_health
    depends_on:
      - mysql
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_AZURE_AD_CLIENT_ID: ${VITE_AZURE_AD_CLIENT_ID}
        VITE_AZURE_AD_TENANT_ID: ${VITE_AZURE_AD_TENANT_ID}
        VITE_AZURE_AD_REDIRECT_URI: ${VITE_AZURE_AD_REDIRECT_URI}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql_data:
