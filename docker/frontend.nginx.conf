server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints every file in /assets (index-B9TEPNHt.js), so a new build
  # produces new names. Those can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached. It is the file that points at the current
  # asset names, so a stale copy keeps loading a previous build's JavaScript —
  # which silently broke Azure AD sign-in after a deploy, because the returning
  # redirect was handled by old code that no longer matched the new flow.
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
